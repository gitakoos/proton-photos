org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official

# AGP 9 changed three R8 defaults; these keep the release output the way AGP 8 built it.
# The newer resource shrinker drops resources that libraries look up by name at run time.
android.r8.optimizedResourceShrinking=false
android.r8.strictFullModeForKeepRules=false
android.r8.globalOptionsInConsumerRules.disallowed=false
