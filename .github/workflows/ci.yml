name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # Validates the wrapper JAR and caches Gradle better than setup-java's cache: gradle.
      # Replaces the archived gradle/wrapper-validation-action.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # schemas/ is committed for MigrationTestHelper / review. Fail if a schema
      # change was produced by the test build but not committed.
      - name: Room schema committed
        run: git diff --exit-code app/schemas

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests
